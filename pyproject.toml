[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciplot-core"
version = "0.1.0"
description = "Local SciPlot core, Studio, recipes, QA, and optional assisted cleanup for scientific plotting."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "openpyxl",
  "xlrd",
  "PyMuPDF",
  "Pillow",
  "platformdirs",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pandas-stubs==3.0.3.260530",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]
studio = [
  "astropy",
  "h5py",
  "iminuit",
  "PyQt6",
  "sip>=6.8,<7",
]

[project.scripts]
sciplot = "sciplot_core.cli:main"

[tool.ruff]
extend-exclude = ["third_party"]

[tool.ruff.lint]
extend-select = [
  "B",
  "DTZ",
  "FURB162",
  "PLC0206",
  "PLW2901",
  "RUF012",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "focused: single-owner, in-process tests used during local iteration",
  "comprehensive: cross-process Veusz, real export, or complete Studio lifecycle tests",
]

[tool.mypy]
python_version = "3.11"
files = [
  "src/sciplot_core/foundation",
  "src/sciplot_core/json_contract.py",
  "src/sciplot_core/figure_plan",
  "src/sciplot_core/delivery/plan_binding.py",
  "src/sciplot_core/delivery/package_builder.py",
  "src/sciplot_core/delivery/package_validation.py",
  "src/sciplot_core/study_model/package_contract.py",
  "src/sciplot_core/publish_state.py",
  "src/sciplot_core/autoplot/publish_integrity.py",
  "src/sciplot_core/autoplot/evidence.py",
  "src/sciplot_core/autoplot/summary.py",
]
mypy_path = "src"
explicit_package_bases = true
follow_imports = "silent"
strict = true
disallow_any_unimported = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
incremental = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sciplot_core = [
  "human_daily_use_validation.json",
  "validated_envelopes.json",
  "intake/intake_static/*",
  "policy/plot_contract.json",
]
