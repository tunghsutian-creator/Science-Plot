name: Minimal repository policy

on:
  push:
    # Ordinary branches get their actual merge test on PR. Use an exact
    # integration ref when the candidate will advance main without rewriting SHA.
    branches: [main, integration, 'integration/**', release, 'release/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      native_regression_preflight:
        description: "Force the 12 historical native regressions before the complete public suites for diagnosis"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  feedback-plan:
    runs-on: ubuntu-24.04
    outputs:
      group: ${{ steps.key.outputs.group }}
      mode: ${{ steps.route.outputs.mode }}
      base: ${{ steps.native-feedback.outputs.base }}
      receipt: ${{ steps.route.outputs.receipt }}
    steps:
      - name: Isolate future obsolete-run scheduling
        id: key
        env:
          SCIPLOT_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          event = os.environ["GITHUB_EVENT_NAME"]
          identity = [os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_WORKFLOW_REF"],
                      "runtime-integrity", "ubuntu-24.04", event,
                      os.environ.get("SCIPLOT_PULL_REQUEST", "") if event == "pull_request" else os.environ["GITHUB_REF"]]
          if event not in {"push", "pull_request"}:
              identity.extend((os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]))
          if not all(isinstance(part, str) and part for part in identity):
              raise SystemExit("Missing exact scheduling identity; required job must fail.")
          group = "sciplot-" + hashlib.sha256(json.dumps(identity).encode()).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write("group=" + group + "\n")
          PY
      - uses: actions/checkout@v4
      - name: Verify exact workflow checkout
        run: python3 src/sciplot_core/verification/main_commit_admission.py --verify-checkout
      - name: Check main commit admission
        id: main-admission
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/sciplot_core/verification/main_commit_admission.py
      - name: Plan bounded public feedback
        if: ${{ steps.main-admission.outcome != 'success' || steps.main-admission.outputs.referenced != 'true' }}
        id: native-feedback
        continue-on-error: true
        env:
          PYTHONPATH: src
          SCIPLOT_EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCIPLOT_EVENT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.ref }}
        run: python3 -m sciplot_core.verification.ci_feedback --base "$SCIPLOT_EVENT_BASE" --candidate-base
      - name: Seal exact feedback route
        id: route
        env:
          SCIPLOT_ADMISSION: ${{ steps.main-admission.outcome == 'success' && steps.main-admission.outputs.referenced == 'true' }}
          SCIPLOT_FEEDBACK_OK: ${{ steps.native-feedback.outcome == 'success' }}
          SCIPLOT_SOURCE_ONLY: ${{ steps.native-feedback.outputs.source_only }}
          SCIPLOT_LAYER: ${{ steps.native-feedback.outputs.layer }}
        run: |
          if [[ "$SCIPLOT_ADMISSION" == true ]]; then
            mode=reference
          elif [[ "$SCIPLOT_FEEDBACK_OK" == true && "$SCIPLOT_SOURCE_ONLY" == true ]]; then
            mode=source-only
          elif [[ "$SCIPLOT_FEEDBACK_OK" == true && "$SCIPLOT_LAYER" == affected && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            mode=affected
          else
            mode=full
          fi
          printf 'mode=%s\nreceipt=%s:%s:%s:plan\n' "$mode" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  public-primary:
    needs: feedback-plan
    if: ${{ needs.feedback-plan.outputs.mode != 'reference' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ format('{0}-public-primary', needs.feedback-plan.outputs.group) }}
      cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact workflow checkout
        run: python3 src/sciplot_core/verification/main_commit_admission.py --verify-checkout
      - name: Enforce minimal runtime distribution
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$({
            # A file cannot be both source-controlled and declared local-only.
            git ls-files -ci --exclude-standard
            git ls-files \
              examples example tmp tools outputs figures ftir_output .tmp_verify \
              .superpowers sciplot-main .DS_Store AGENTS.md DEVELOPMENT_LOG.md Makefile \
              Launch_SciPlot_App.command
            # The curated docs and public showcase are explicitly unignored in
            # .gitignore. The tracked-ignored check above still rejects any
            # local-only docs without duplicating that allowlist here.
            git ls-files \
              third_party/veusz/tests \
              third_party/veusz/examples \
              third_party/veusz/Documents \
              third_party/veusz/.github \
              third_party/veusz/support \
              third_party/veusz/ChangeLog \
              third_party/veusz/INSTALL.md \
              third_party/veusz/README.md \
              third_party/labplot_reference
          } | sed '/^$/d')"
          if [[ -n "$forbidden" ]]; then
            echo "Local-only or non-distribution files are tracked:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi
      - name: Compile SciPlot-owned Python
        run: python3 -m compileall -q src/sciplot_core src/sciplot_recipes
      - name: Run source-only documentation feedback
        if: ${{ needs.feedback-plan.outputs.mode == 'source-only' }}
        env:
          PYTHONPATH: src
          SCIPLOT_EVENT_BASE: ${{ needs.feedback-plan.outputs.base }}
          SCIPLOT_EVENT_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.ref }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest>=9,<10' platformdirs
          .venv/bin/python -m sciplot_core.verification.ci_feedback --base "$SCIPLOT_EVENT_BASE" --run-source-only
      - name: Prepare native test runtime
        if: ${{ needs.feedback-plan.outputs.mode == 'full' || needs.feedback-plan.outputs.mode == 'affected' }}
        uses: ./.github/actions/native-runtime
      - name: Run lint gate
        if: ${{ needs.feedback-plan.outputs.mode == 'full' || needs.feedback-plan.outputs.mode == 'affected' }}
        env:
          SCIPLOT_FEEDBACK_LAYER: ${{ needs.feedback-plan.outputs.mode }}
          SCIPLOT_EVENT_BASE: ${{ needs.feedback-plan.outputs.base }}
          SCIPLOT_EVENT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.ref }}
        run: python3 -m sciplot_core.verification.ci_feedback --base "$SCIPLOT_EVENT_BASE" --lint "$SCIPLOT_FEEDBACK_LAYER"
      - name: Run shared source contracts
        if: ${{ needs.feedback-plan.outputs.mode == 'full' }}
        run: |
          python3 - <<'PYCONTRACTS'
          import subprocess
          import sys
          from sciplot_core.verification.source_contracts import CHEAP_SOURCE_TARGETS, IMPORT_GRAPH_TARGET
          # This step only runs when the complete public profile is required.
          # Its focused tier runs the same import graph check on the staged source.
          targets = [target for target in CHEAP_SOURCE_TARGETS if target != IMPORT_GRAPH_TARGET]
          subprocess.run([sys.executable, "-m", "pytest", "-q", *targets], check=True)
          PYCONTRACTS
      - name: Run scoped static type gate
        if: ${{ needs.feedback-plan.outputs.mode == 'full' || needs.feedback-plan.outputs.mode == 'affected' }}
        run: |
          python3 -m mypy --platform linux
          python3 -m mypy --platform darwin
      - name: Verify minimal wheel surface
        if: ${{ needs.feedback-plan.outputs.mode == 'full' || needs.feedback-plan.outputs.mode == 'affected' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip wheel . --no-deps --no-build-isolation \
            --wheel-dir /tmp/sciplot-wheel
          python3 tests/test_wheel_surface.py /tmp/sciplot-wheel/*.whl
      - name: Check known native CI regressions before the public suites
        if: ${{ needs.feedback-plan.outputs.mode == 'full' && github.event_name == 'workflow_dispatch' && inputs.native_regression_preflight == true }}
        # The comprehensive profile already executes these nodes. Only an
        # explicit manual diagnostic request repeats them as an early check.
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          from sciplot_core.verification.public_stage import RECEIPT, create_stage, review_stage_reports, runtime_binding

          root = Path.cwd().resolve()
          output = root / ".tmp_verify/ci_known_native_regressions"
          environment = dict(os.environ)
          assert not environment.get("PYTEST_ADDOPTS", "").strip()
          from sciplot_core.foundation.research_destination import require_data_destination
          workspace_parent = require_data_destination(Path(os.environ["RUNNER_TEMP"]))
          pytest_workspace = Path(tempfile.mkdtemp(prefix="sciplot-native-preflight-", dir=workspace_parent))
          pytest_tmp = pytest_workspace / "pytest-tmp"
          from sciplot_core.verification.ci_feedback import NATIVE_PREFIX, NATIVE_EXPECTED
          required_prefix = list(NATIVE_PREFIX)
          expected = set(NATIVE_EXPECTED)
          expression = " or ".join(sorted({node.split("::", 1)[1].split("[", 1)[0] for node in expected}))
          stage, child_environment, before = create_stage(root, output, environment)
          receipt_path = stage / RECEIPT
          assert json.loads(receipt_path.read_bytes()) == before
          receipt_sha256 = hashlib.sha256(receipt_path.read_bytes()).hexdigest()
          # The validator must be loaded by the actual staged source owner.
          # Its receipt remains fixed to create_stage's original in-memory seal.
          validate = [sys.executable, "-c", "import hashlib,os,sys;from pathlib import Path;from sciplot_core.verification.public_stage import RECEIPT,validate_stage;assert hashlib.sha256((Path.cwd()/RECEIPT).read_bytes()).hexdigest()==sys.argv[1];validate_stage(Path.cwd(),dict(os.environ))", receipt_sha256]
          subprocess.run(validate, cwd=stage, env=child_environment, check=True)
          finish, reports_path = output / "finish.json", output / "reports.json"
          child_environment.update(SCIPLOT_VERIFY_FINISH=str(finish), SCIPLOT_PUBLIC_STAGE_REPORT=str(reports_path))
          command = [sys.executable, "-m", "pytest", "-vv", "--tb=short", "-p", "sciplot_core.verification.pytest_finish",
                     "-p", "sciplot_core.verification.public_stage", "--input-scope", "public-all", "-k", expression,
                     "--basetemp", str(pytest_tmp)]
          result = subprocess.run(command, cwd=stage, env=child_environment, stdin=subprocess.DEVNULL, check=False)
          post = subprocess.run(validate, cwd=stage, env=child_environment, check=False)
          marker = json.loads(finish.read_bytes()) if finish.is_file() else {}
          reports = json.loads(reports_path.read_bytes()) if reports_path.is_file() else {}
          issues = review_stage_reports(marker, reports, platform=sys.platform)
          if set(marker.get("selected_tests", [])) != expected:
              issues.append("The bounded CI regression selection must contain exactly the observed failures and their three predecessors.")
          if marker.get("selected_tests", [])[:len(required_prefix)] != required_prefix:
              issues.append("The bounded CI regression order must retain the original three annotation predecessors and four attached failures.")
          phases = [(row.get("nodeid"), row.get("when"), row.get("outcome")) for row in reports.get("reports", [])]
          required = {(node, phase, "passed") for node in expected for phase in ("setup", "call", "teardown")}
          if len(phases) != len(required) or set(phases) != required:
              issues.append("Every selected regression setup/call/teardown phase must pass without skips or duplicates.")
          origin_runtime_equal = runtime_binding(root, environment) == before["runtime"]
          if post.returncode != 0 or not origin_runtime_equal:
              issues.append("Original or staged source/runtime binding changed.")
          summary = {"kind": "sciplot_bounded_ci_regression_preflight", "claim": "DIAGNOSTIC_ONLY", "origin_head": before["origin_head"],
                     "actual_exit_code": result.returncode, "finish_complete": marker.get("complete"),
                     "pytest_workspace": str(pytest_workspace),
                     "selected_nodes": marker.get("selected_tests", []), "phase_count": len(phases), "issues": issues,
                     "full_public_acceptance": False, "scientific_acceptance": False, "access_capture_complete": False}
          (output / "scoped-result.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary))
          if result.returncode or issues:
              # Only this fresh twelve-node run owns these generated outputs.
              # Never enumerate source fixtures, environment files or other runs.
              diagnostic_roots = (
                  (pytest_tmp, {"native-worker.log"}),
                  (stage / ".tmp_verify/entry-checkpoints/native-cases",
                   {"child.stdout.log", "child.stderr.log", "result.json", "owned-native.json", "owned-native-progress.json"}),
                  (stage / ".tmp_verify/attached-semantic/native-cases",
                   {"child.stdout.log", "child.stderr.log", "result.json", "owned-native.json", "failed-native-process.json"}),
              )
              for directory, filenames in diagnostic_roots:
                  if directory.resolve() != directory:
                      continue
                  for current, directories, files in os.walk(directory, followlinks=False):
                      directories[:] = sorted(name for name in directories if not (Path(current) / name).is_symlink())
                      for name in sorted(set(files) & filenames):
                          log = Path(current) / name
                          if not log.is_symlink() and log.is_file():
                              print(f"Generated regression diagnostic: {log}")
                              print(log.read_text(errors="replace"))
          raise SystemExit(result.returncode if result.returncode else (4 if issues else 0))
          PY
      - name: Run reviewed affected public feedback
        if: ${{ needs.feedback-plan.outputs.mode == 'affected' }}
        id: affected-public
        env:
          SCIPLOT_EVENT_BASE: ${{ needs.feedback-plan.outputs.base }}
          SCIPLOT_EVENT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref && format('refs/heads/{0}', github.event.pull_request.base.ref) || github.ref }}
        run: python3 -m sciplot_core.verification.ci_feedback --base "$SCIPLOT_EVENT_BASE" --run-affected
      - name: Run focused and comprehensive second shard
        if: ${{ needs.feedback-plan.outputs.mode == 'full' }}
        id: complete-public
        run: python3 -m sciplot_core.verification.ci_public_profiles primary
      - name: Preserve public failure evidence
        if: ${{ failure() && (steps.complete-public.outcome == 'failure' || steps.affected-public.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: public-failure-primary-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .tmp_verify/ci-public-profiles/*.log
            .tmp_verify/ci_public_primary/public-*/command.log
            .tmp_verify/ci_public_primary/public-*/finish.json
            .tmp_verify/ci_public_primary/public-*/reports.json
            .tmp_verify/ci_public_primary/public-*/result.json
            .tmp_verify/ci_public_primary/public-*/pytest-progress.json
            .tmp_verify/ci_public_affected/feedback-result.json
            .tmp_verify/ci_public_affected/command.log
            .tmp_verify/ci_public_affected/finish.json
            .tmp_verify/ci_public_affected/reports.json
            .tmp_verify/ci_public_affected/result.json
            .tmp_verify/ci_public_affected/pytest-progress.json
            .tmp_verify/ci_public_affected/public-*/command.log
            .tmp_verify/ci_public_affected/public-*/finish.json
            .tmp_verify/ci_public_affected/public-*/reports.json
            .tmp_verify/ci_public_affected/public-*/result.json
            .tmp_verify/ci_public_affected/public-*/pytest-progress.json
      - name: Verify source-checkout wrapper bootstrap
        if: ${{ needs.feedback-plan.outputs.mode == 'full' || needs.feedback-plan.outputs.mode == 'affected' }}
        run: env -u PYTHONPATH SCIPLOT_PYTHON=python3 skill/scripts/sciplot --help >/dev/null
      - name: Run fixture-free lifecycle smoke
        if: ${{ needs.feedback-plan.outputs.mode == 'full' }}
        run: skill/scripts/sciplot smoke --out "$RUNNER_TEMP/sciplot-runtime-smoke" --json
      - name: Seal public-primary result
        id: receipt
        run: printf 'receipt=%s:%s:%s:public-primary\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  public-native-first:
    needs: feedback-plan
    if: ${{ needs.feedback-plan.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ format('{0}-public-native-first', needs.feedback-plan.outputs.group) }}
      cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact workflow checkout
        run: python3 src/sciplot_core/verification/main_commit_admission.py --verify-checkout
      - name: Prepare native test runtime
        uses: ./.github/actions/native-runtime
      - name: Run comprehensive first shard
        id: comprehensive-first
        run: python3 -m sciplot_core.verification.ci_public_profiles comprehensive-first
      - name: Preserve first-shard failure evidence
        if: ${{ failure() && steps.comprehensive-first.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-failure-native-first-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .tmp_verify/ci-public-profiles/comprehensive-first.log
            .tmp_verify/ci_public_comprehensive-first/command.log
            .tmp_verify/ci_public_comprehensive-first/finish.json
            .tmp_verify/ci_public_comprehensive-first/reports.json
            .tmp_verify/ci_public_comprehensive-first/result.json
            .tmp_verify/ci_public_comprehensive-first/pytest-progress.json
      - name: Seal public-native-first result
        id: receipt
        run: printf 'receipt=%s:%s:%s:public-native-first\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  runtime-integrity:
    needs: [feedback-plan, public-primary, public-native-first]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require an exact complete feedback result
        env:
          SCIPLOT_PLAN_RESULT: ${{ needs.feedback-plan.result }}
          SCIPLOT_PLAN_GROUP: ${{ needs.feedback-plan.outputs.group }}
          SCIPLOT_PLAN_MODE: ${{ needs.feedback-plan.outputs.mode }}
          SCIPLOT_PLAN_RECEIPT: ${{ needs.feedback-plan.outputs.receipt }}
          SCIPLOT_PRIMARY_RESULT: ${{ needs.public-primary.result }}
          SCIPLOT_PRIMARY_RECEIPT: ${{ needs.public-primary.outputs.receipt }}
          SCIPLOT_FIRST_RESULT: ${{ needs.public-native-first.result }}
          SCIPLOT_FIRST_RECEIPT: ${{ needs.public-native-first.outputs.receipt }}
        run: |
          set -eu
          receipt="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_SHA"
          test "$SCIPLOT_PLAN_RESULT" = success
          test -n "$SCIPLOT_PLAN_GROUP"
          test "$SCIPLOT_PLAN_RECEIPT" = "$receipt:plan"
          case "$SCIPLOT_PLAN_MODE" in
            reference)
              test "$SCIPLOT_PRIMARY_RESULT" = skipped
              test -z "$SCIPLOT_PRIMARY_RECEIPT"
              ;;
            source-only|affected|full)
              test "$SCIPLOT_PRIMARY_RESULT" = success
              test "$SCIPLOT_PRIMARY_RECEIPT" = "$receipt:public-primary"
              ;;
            *) exit 1 ;;
          esac
          if [[ "$SCIPLOT_PLAN_MODE" == full ]]; then
            test "$SCIPLOT_FIRST_RESULT" = success
            test "$SCIPLOT_FIRST_RECEIPT" = "$receipt:public-native-first"
          else
            test "$SCIPLOT_FIRST_RESULT" = skipped
            test -z "$SCIPLOT_FIRST_RECEIPT"
          fi
