# Diagnostic branch only: do not merge this reduced selection into release gates.
name: Linux native failure diagnostic

on:
  push:
    branches:
      - codex/sciplot-linux-native-diagnostic-20261014

jobs:
  runtime-integrity:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Enforce minimal runtime distribution
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$({
            # A file cannot be both source-controlled and declared local-only.
            git ls-files -ci --exclude-standard
            git ls-files \
              examples example tmp tools outputs figures ftir_output .tmp_verify \
              .superpowers sciplot-main .DS_Store AGENTS.md DEVELOPMENT_LOG.md Makefile \
              Launch_SciPlot_App.command
            # The curated docs and public showcase are explicitly unignored in
            # .gitignore. The tracked-ignored check above still rejects any
            # local-only docs without duplicating that allowlist here.
            git ls-files \
              third_party/veusz/tests \
              third_party/veusz/examples \
              third_party/veusz/Documents \
              third_party/veusz/.github \
              third_party/veusz/support \
              third_party/veusz/ChangeLog \
              third_party/veusz/INSTALL.md \
              third_party/veusz/README.md \
              third_party/labplot_reference
          } | sed '/^$/d')"
          if [[ -n "$forbidden" ]]; then
            echo "Local-only or non-distribution files are tracked:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi
      - name: Compile SciPlot-owned Python
        run: python3 -m compileall -q src/sciplot_core src/sciplot_gui src/sciplot_recipes
      - name: Install matching system Python and Qt toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential qt6-base-dev qt6-image-formats-plugins python3-dev python3-venv zsh \
            python3-pyqt6 python3-pyqt6.qtsvg pyqt6-dev pyqt6-dev-tools \
            fonts-noto-cjk
          # Ubuntu's PyQt6 and qmake use the same distribution Qt libraries.
          # A PyPI PyQt6 wheel carries a separate Qt runtime, so keep the
          # distribution interpreter and expose its bindings to this venv.
          /usr/bin/python3 -m venv --system-site-packages .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
      - name: Install local runtime
        run: python3 -m pip install -e '.[studio,dev,mcp]'
      - name: Verify Qt build and runtime identity
        run: |
          python3 - <<'PY'
          import subprocess
          import shutil
          import sys
          import json
          import sysconfig
          import tempfile
          from pathlib import Path
          import PyQt6
          from PyQt6 import QtCore, QtGui, QtWidgets, QtPrintSupport, QtSvg, QtSvgWidgets, sip, uic
          from PyQt6.uic import loadUi

          qmake = subprocess.check_output(["qmake6", "-query", "QT_VERSION"], text=True).strip()
          runtime = QtCore.qVersion()
          binding = Path(PyQt6.__file__).resolve()
          assert sys.version_info[:2] == (3, 12), sys.version
          assert binding.is_relative_to("/usr/lib/python3/dist-packages"), binding
          assert qmake == runtime, (qmake, runtime)
          assert (binding.parent / "bindings/QtCore/QtCore.toml").is_file(), binding
          assert Path(uic.__file__).resolve().is_relative_to(binding.parent), uic.__file__
          assert callable(loadUi) and all((QtGui, QtWidgets, QtPrintSupport, QtSvg, QtSvgWidgets, sip))
          assert shutil.which("zsh"), "Delivery launchers require zsh"
          formats = {bytes(name).decode("ascii").lower() for name in QtGui.QImageWriter.supportedImageFormats()}
          assert {"png", "tiff"} <= formats, sorted(formats)
          with tempfile.TemporaryDirectory(prefix="sciplot-qt-tiff-") as temporary:
              path = Path(temporary) / "probe.tiff"
              image = QtGui.QImage(1, 1, QtGui.QImage.Format.Format_RGB32)
              image.fill(QtGui.QColor("red"))
              writer = QtGui.QImageWriter(str(path), b"tiff")
              assert writer.write(image), writer.errorString()
              assert path.is_file() and path.stat().st_size > 0
              reopened = QtGui.QImage(str(path))
              assert not reopened.isNull() and (reopened.width(), reopened.height()) == (1, 1)
              assert reopened.pixelColor(0, 0) == image.pixelColor(0, 0)
          print(f"Python {sys.version.split()[0]}; PyQt {QtCore.PYQT_VERSION_STR}; Qt build/runtime {runtime}; {binding}")
          from sciplot_core.verification.private_process_boundaries import executable_hash, runtime_identity
          observation_runtime = runtime_identity()
          executable_sha256 = executable_hash(sys.executable)
          assert executable_sha256 is not None
          print(json.dumps({
              "observation_runtime": observation_runtime,
              "python_executable_sha256": executable_sha256,
              "executable_owns_observation_core": executable_sha256 in observation_runtime["loaded_core_sha256"],
              "py_enable_shared_build_flag": sysconfig.get_config_var("Py_ENABLE_SHARED"),
          }, sort_keys=True))
          PY
      - name: Verify Chinese glyph fallback in the system Qt runtime
        run: |
          python3 - <<'PYFONT'
          from PyQt6.QtGui import QFont, QGuiApplication, QTextLayout
          app = QGuiApplication([])
          text = "\u4f4e\u6e29\u6297\u51b2\u51fb\u80fd\u529b"
          layout = QTextLayout(text, QFont("Arial", 8))
          layout.beginLayout()
          line = layout.createLine()
          layout.endLayout()
          runs = layout.glyphRuns()
          assert runs and all(index != 0 for run in runs for index in run.glyphIndexes()), "Missing Chinese glyph fallback"
          print({"text": text, "fallback_families": [run.rawFont().familyName() for run in runs]})
          PYFONT
      - name: Run lint gate
        run: python3 -m ruff check src tests
      - name: Run scoped static type gate
        run: python3 -m mypy
      - name: Build vendored Veusz helpers
        working-directory: third_party/veusz
        run: QMAKE_EXE="$(command -v qmake6)" python3 setup.py build_ext --inplace
      - name: Verify vendored Veusz helpers
        env:
          PYTHONPATH: third_party/veusz
        run: python3 -c 'from veusz.helpers import _nc_cntr, qtmml, qtloops, recordpaint, threed; assert all((qtloops, qtmml, recordpaint, threed, _nc_cntr))'
      - name: Verify minimal wheel surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip wheel . --no-deps --no-build-isolation \
            --wheel-dir /tmp/sciplot-wheel
          python3 tests/test_wheel_surface.py /tmp/sciplot-wheel/*.whl
      - name: Preserve the original performance font failure as a generated baseline
        shell: bash
        env:
          SCIPLOT_PUBLIC_STAGE_REPORT: .tmp_verify/ci_linux_native_diagnostic/baseline-reports.json
        run: |
          set -euo pipefail
          mkdir -p .tmp_verify/ci_linux_native_diagnostic
          set +e
          python3 -m pytest -q --tb=long -p sciplot_core.verification.public_stage \
            --input-scope public-comprehensive \
            --basetemp=.tmp_verify/ci_linux_native_diagnostic/baseline \
            -k test_ready_performance_studio_review_preserves_lineage \
            2>&1 | tee .tmp_verify/ci_linux_native_diagnostic/baseline-command.log
          baseline_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$baseline_exit" > .tmp_verify/ci_linux_native_diagnostic/baseline-exit.txt
          test "$baseline_exit" -eq 1
          python3 - <<'PYBASE'
          import json
          from pathlib import Path
          reports = list(Path('.tmp_verify/ci_linux_native_diagnostic/baseline').rglob('publication_qa.json'))
          assert len(reports) == 1, reports
          qa = json.loads(reports[0].read_text())
          assert qa['blocking_check_ids'] == ['font_families'], qa['blocking_check_ids']
          print('Original unmodified performance baseline reproduced only its font-family rejection')
          PYBASE
      - name: Prepare a bound source-only diagnostic candidate without mutating checkout
        run: |
          python3 - <<'PYPROTOTYPE'
          from pathlib import Path
          import hashlib
          import json
          import os
          from sciplot_core.verification.public_stage import create_stage, source_binding, _git
          root = Path.cwd().resolve()
          output = root / '.tmp_verify/ci_linux_native_diagnostic'
          before = source_binding(root)
          original_head = _git(root, 'rev-parse', 'HEAD').strip()
          origin, origin_environment, original_copy = create_stage(root, output / 'prototype-origin', dict(os.environ))
          compat = origin / 'src/sciplot_core/studio_core/qt_compat.py'
          vendored = origin / 'third_party/veusz/veusz/utils/textrender.py'
          policy = origin / 'src/sciplot_core/policy/frame_export.py'
          pre = {str(path.relative_to(origin)): hashlib.sha256(path.read_bytes()).hexdigest() for path in (compat,vendored,policy)}
          candidate = r'''"""Diagnostic-only runtime experiment; not source or a release gate."""
          import json
          import os
          import re
          from pathlib import Path

          _PATTERN = re.compile("\u207b(?=[\u2070\u00b9\u00b2\u00b3\u2074-\u2079])")


          def _record(event):
              destination = os.environ.get("SCIPLOT_MINUS_PROTOTYPE_OUT")
              if destination:
                  with Path(destination).open("a") as stream:
                      stream.write(json.dumps(event, ensure_ascii=True) + "\n")


          def install():
              from PyQt6.QtCore import QPointF
              from PyQt6.QtGui import QRawFont
              from veusz.utils import textrender

              original = textrender.PartText.render
              if getattr(original, "_sciplot_minus_prototype", False):
                  return

              def render(part, state):
                  text = part.text
                  positions = [match.start() for match in _PATTERN.finditer(text)]
                  if not positions or not state.actually_render:
                      return original(part, state)
                  raw = QRawFont.fromFont(state.font)
                  if raw.isValid() and raw.supportsCharacter(0x207B):
                      return original(part, state)
                  if raw.familyName().casefold().replace(" ", "") != "liberationsans":
                      return original(part, state)
                  painter = state.painter
                  observed = painter.fontInfo()
                  event = {"text": text, "primary_family": raw.familyName(),
                           "painter_family": observed.family(), "size_pt": state.font.pointSizeF(),
                           "paint_device": type(painter.device()).__name__,
                           "primary_has_superscript_minus": raw.supportsCharacter(0x207B) if raw.isValid() else None}
                  families_match = raw.familyName().casefold().replace(" ", "") == observed.family().casefold().replace(" ", "")
                  if not raw.isValid() or not families_match or painter.font() != state.font or not raw.supportsCharacter(0x2212):
                      _record({**event, "status": "blocked_unknown_primary_or_minus"})
                      return original(part, state)
                  metrics = state.fontMetrics()
                  start_x = state.x
                  full_advance = metrics.horizontalAdvance(text)
                  candidates = []
                  for index in positions:
                      digit = text[index + 1]
                      if not raw.supportsCharacter(ord(digit)):
                          _record({**event, "status": "blocked_primary_missing_adjacent_digit"})
                          return original(part, state)
                      slot_left = start_x + metrics.horizontalAdvance(text[:index])
                      slot_right = start_x + metrics.horizontalAdvance(text[:index + 1])
                      minus = metrics.tightBoundingRect("\u2212")
                      digit_ink = metrics.tightBoundingRect(digit)
                      baseline_delta = digit_ink.center().y() - minus.center().y()
                      ink_offset = ((slot_right - slot_left) - minus.width()) / 2.0 - minus.left()
                      minus_x = slot_left + ink_offset
                      minus.translate(minus_x, state.y + baseline_delta)
                      digit_ink.translate(slot_right, state.y)
                      fits = bool(minus.left() >= slot_left and minus.right() <= slot_right
                                  and not minus.intersects(digit_ink))
                      row = {"slot": [slot_left, slot_right], "minus_ink": [minus.left(), minus.top(), minus.right(), minus.bottom()],
                             "digit_ink": [digit_ink.left(), digit_ink.top(), digit_ink.right(), digit_ink.bottom()],
                             "baseline_delta": baseline_delta, "fits": fits}
                      candidates.append((index, minus_x, baseline_delta, row))
                      if not fits:
                          _record({**event, "status": "blocked_ink_outside_original_slot", "geometry": row})
                          return original(part, state)
                  previous = 0
                  for index, x, delta, row in candidates:
                      if index > previous:
                          painter.drawText(QPointF(start_x + metrics.horizontalAdvance(text[:previous]), state.y), text[previous:index])
                      painter.drawText(QPointF(x, state.y + delta), "\u2212")
                      previous = index + 1
                  if previous < len(text):
                      painter.drawText(QPointF(start_x + metrics.horizontalAdvance(text[:previous]), state.y), text[previous:])
                  state.x = start_x + full_advance
                  _record({**event, "status": "applied", "full_advance_preserved": full_advance,
                           "geometry": [row for _index, _x, _delta, row in candidates]})

              render._sciplot_minus_prototype = True
              textrender.PartText.render = render
          '''
          module = origin / 'src/sciplot_core/studio_core/_diagnostic_superscript_minus.py'
          assert not module.exists()
          module.write_text(candidate)
          needle = '    ensure_veusz_numeric_precision()\n'
          source = compat.read_text()
          assert source.count(needle) == 1
          compat.write_text(source.replace(needle, '    from sciplot_core.studio_core._diagnostic_superscript_minus import install\n    install()\n' + needle))
          post = {str(path.relative_to(origin)): hashlib.sha256(path.read_bytes()).hexdigest() for path in (compat,vendored,policy,module)}
          assert pre[str(vendored.relative_to(origin))] == post[str(vendored.relative_to(origin))]
          assert pre[str(policy.relative_to(origin))] == post[str(policy.relative_to(origin))]
          _git(origin, 'add', 'src/sciplot_core/studio_core/qt_compat.py', 'src/sciplot_core/studio_core/_diagnostic_superscript_minus.py')
          _git(origin, '-c', 'commit.gpgsign=false', 'commit', '-qm', 'Diagnostic-only bounded native text experiment')
          stage, environment, receipt = create_stage(origin, origin / '.tmp_verify/final-stage', origin_environment)
          assert source_binding(root) == before and _git(root, 'rev-parse', 'HEAD').strip() == original_head
          (output / 'prototype-source.py').write_text(candidate)
          mutation = {'kind':'diagnostic_runtime_prototype_not_release_validation', 'original_source_binding':before,
                      'original_head':original_head,'prototype_origin':str(origin),'stage_root':str(stage),
                      'generated_candidate_head':receipt['origin_head'],'generated_stage_head':receipt['stage_head'],
                      'before':pre,'after':post,'original_source_unchanged':True}
          (output / 'prototype-mutation.json').write_text(json.dumps(mutation,indent=2))
          print(json.dumps({key:value for key,value in mutation.items() if key != 'original_source_binding'},indent=2))
          PYPROTOTYPE
      - name: Diagnose original four and daemon controls in the bound candidate stage
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          import json
          import os
          import subprocess
          import sys
          from sciplot_core.verification.public_stage import source_binding, _git
          root=Path.cwd().resolve()
          output=root / '.tmp_verify/ci_linux_native_diagnostic'
          configuration=json.loads((output / 'prototype-mutation.json').read_text())
          stage=Path(configuration['stage_root'])
          environment=dict(os.environ, SCIPLOT_REPO=str(stage), SCIPLOT_SOURCE_ROOT=str(stage/'src'),
                           SCIPLOT_RUNTIME_REPO=str(stage), SCIPLOT_VEUSZ_ROOT=str(stage/'third_party/veusz'),
                           SCIPLOT_PYTHON=sys.executable, PYTHONPATH=os.pathsep.join((str(stage/'src'),str(stage/'tests'))),
                           SCIPLOT_PUBLIC_STAGE_REPORT=str(output/'reports.json'),
                           SCIPLOT_MINUS_PROTOTYPE_OUT=str(output/'minus-events.jsonl'))
          for key in ('SCIPLOT_PUBLIC_INPUT_GUARD','SCIPLOT_PUBLIC_GUARD_BOOTSTRAP','SCIPLOT_PUBLIC_GUARD_WRAPPER_BOOTSTRAP'):
              environment.pop(key,None)
          selection=('test_ready_performance_studio_review_preserves_lineage or '
                     'test_template_creation_has_exactly_one_native_export_and_no_repeated_preparation or '
                     'test_native_radar_long_mixed_units_and_incomplete_negative_reference or '
                     'test_daemon_normal_termination_closes_native_worker_and_hardkill_stays_unsealed')
          command=[sys.executable,'-m','pytest','-q','--tb=long','-p','sciplot_core.verification.public_stage',
                   '--input-scope','public-comprehensive','--basetemp='+str(output/'pytest'),
                   '--junitxml='+str(output/'junit.xml'),'-k',selection]
          print(json.dumps({'kind':'bounded_native_prototype_six_node_diagnostic_not_release','command':command,'stage_root':str(stage)}),flush=True)
          with (output/'command.log').open('xb') as log:
              process=subprocess.run(command,cwd=stage,env=environment,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,check=False)
          print((output/'command.log').read_text())
          assert source_binding(root) == configuration['original_source_binding']
          assert _git(root,'rev-parse','HEAD').strip() == configuration['original_head']
          sys.exit(process.returncode)
          PYRUN
      - name: Summarize generated-only publication QA details
        if: always()
        run: |
          python3 - <<'PYQA'
          import json
          from pathlib import Path
          root = Path(".tmp_verify/ci_linux_native_diagnostic")
          root.mkdir(parents=True, exist_ok=True)
          details = []
          for path in sorted((root / "pytest").rglob("publication_qa.json")):
              payload = json.loads(path.read_text())
              details.append({"path": str(path), "status": payload.get("status"),
                              "blocking_check_ids": payload.get("blocking_check_ids"),
                              "failed_checks": [check for check in payload.get("checks", []) if check.get("status") == "failed"]})
          for path in sorted((root / "pytest").rglob("manifest.json")):
              payload = json.loads(path.read_text())
              qa = payload.get("qa") or {}
              spans = [{"text": span.get("text"), "font": span.get("font"), "size": span.get("size")}
                       for pdf in qa.get("pdfs", []) for span in pdf.get("text_objects", {}).get("visible_spans", [])
                       if "dejavu" in str(span.get("font")).lower()]
              if spans:
                  details.append({"manifest": str(path), "unexpected_dejavu_spans": spans})
          (root / "qa-details.json").write_text(json.dumps(details, ensure_ascii=True, indent=2))
          print(json.dumps(details, ensure_ascii=True, indent=2))
          PYQA
      - name: Preserve generated native prototype visual and geometry evidence
        if: always()
        run: |
          python3 - <<'PYVISUAL'
          import json
          import shutil
          from pathlib import Path
          import pymupdf
          from PIL import Image
          root = Path('.tmp_verify/ci_linux_native_diagnostic').resolve()
          visual = root / 'visual'
          visual.mkdir(exist_ok=True)
          records = []
          for phase in ('baseline', 'pytest'):
              for manifest in sorted((root / phase).rglob('manifest.json')):
                  payload = json.loads(manifest.read_text())
                  qa = payload.get('qa') or {}
                  pdfs = qa.get('pdfs', [])
                  tiffs = qa.get('tiffs', [])
                  for index, item in enumerate([*pdfs, *tiffs]):
                      source = Path(item['path']).resolve()
                      if not source.is_relative_to(root / phase) or not source.is_file():
                          continue
                      name = f'{phase}-{len(records)}-{source.name}'
                      target = visual / name
                      shutil.copy2(source, target)
                      record = {'phase': phase, 'source': str(source.relative_to(root)), 'artifact': str(target.relative_to(root))}
                      if source.suffix.lower() == '.pdf':
                          with pymupdf.open(source) as document:
                              page = document[0]
                              page.get_pixmap(matrix=pymupdf.Matrix(4,4)).save(str(target.with_suffix('.png')))
                              spans = [span for block in page.get_text('dict')['blocks'] if 'lines' in block for line in block['lines'] for span in line['spans']]
                              record['minus_spans'] = [{key: span.get(key) for key in ('text','font','size','bbox','origin')} for span in spans if any(char in span['text'] for char in ('\u207b','\u2212'))]
                              for count, span in enumerate(record['minus_spans']):
                                  clip = pymupdf.Rect(span['bbox']) + (-14,-10,18,12)
                                  clip &= page.rect
                                  page.get_pixmap(matrix=pymupdf.Matrix(12,12), clip=clip).save(str(visual / f'{name}-minus-{count}.png'))
                      else:
                          with Image.open(source) as image:
                              image.save(target.with_suffix('.png'))
                      records.append(record)
              for index, source in enumerate(sorted((root / phase).glob('test_native_radar_long_mixed_u*/native/**/*.pdf'))):
                  target = visual / f'{phase}-radar-{index}.pdf'
                  shutil.copy2(source, target)
                  with pymupdf.open(source) as document:
                      document[0].get_pixmap(matrix=pymupdf.Matrix(4,4)).save(str(target.with_suffix('.png')))
                  records.append({'phase':phase,'source':str(source.relative_to(root)),'artifact':str(target.relative_to(root))})
              for index, source in enumerate(sorted((root / phase).glob('test_native_radar_long_mixed_u*/native/**/*.tiff'))):
                  target = visual / f'{phase}-radar-{index}.tiff'
                  shutil.copy2(source, target)
                  with Image.open(source) as image:
                      image.save(target.with_suffix('.png'))
                  records.append({'phase':phase,'source':str(source.relative_to(root)),'artifact':str(target.relative_to(root))})
          (root / 'visual-inventory.json').write_text(json.dumps(records, ensure_ascii=True, indent=2))
          print(json.dumps(records, ensure_ascii=True, indent=2))
          events = root / 'minus-events.jsonl'
          if events.is_file():
              print('ACTUAL_NATIVE_MINUS_PROTOTYPE_EVENTS')
              print(events.read_text())
          PYVISUAL
      - name: Preserve generated-only native diagnostic reports and command log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-failure-diagnostic
          path: |
            .tmp_verify/ci_linux_native_diagnostic/command.log
            .tmp_verify/ci_linux_native_diagnostic/reports.json
            .tmp_verify/ci_linux_native_diagnostic/junit.xml
            .tmp_verify/ci_linux_native_diagnostic/qa-details.json
            .tmp_verify/ci_linux_native_diagnostic/baseline-command.log
            .tmp_verify/ci_linux_native_diagnostic/baseline-reports.json
            .tmp_verify/ci_linux_native_diagnostic/baseline-exit.txt
            .tmp_verify/ci_linux_native_diagnostic/minus-events.jsonl
            .tmp_verify/ci_linux_native_diagnostic/prototype-source.py
            .tmp_verify/ci_linux_native_diagnostic/prototype-mutation.json
            .tmp_verify/ci_linux_native_diagnostic/visual-inventory.json
            .tmp_verify/ci_linux_native_diagnostic/visual/
          include-hidden-files: true
          if-no-files-found: warn
