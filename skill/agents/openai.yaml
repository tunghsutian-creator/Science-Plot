display_name: SciPlot Materials Analysis
short_description: Create and refine editable scientific figures with the local CLI.
default_prompt: Use the current SKILL.md route and public local task/plot CLI to turn this materials dataset and intent into editable scientific figures. Complete the requested PDF/TIFF/data export and delivery locally through SciPlot's Veusz backend, preserving raw inputs and the figure's saved authority. Review bound previews and current QA, then use the returned continuation. Open an advanced or compatibility route only when the requested workflow needs it.
