name: Minimal repository policy

on:
  push:
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env: &runtime_environment
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: "1"
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &distribution_policy
        name: Enforce minimal runtime distribution
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$({
            # A file cannot be both source-controlled and declared local-only.
            git ls-files -ci --exclude-standard
            git ls-files \
              examples example tmp tools outputs figures ftir_output .tmp_verify \
              .superpowers sciplot-main .DS_Store AGENTS.md DEVELOPMENT_LOG.md Makefile \
              Launch_SciPlot_App.command
            # The curated docs and public showcase are explicitly unignored in
            # .gitignore. The tracked-ignored check above still rejects any
            # local-only docs without duplicating that allowlist here.
            git ls-files \
              third_party/veusz/tests \
              third_party/veusz/examples \
              third_party/veusz/Documents \
              third_party/veusz/.github \
              third_party/veusz/support \
              third_party/veusz/ChangeLog \
              third_party/veusz/INSTALL.md \
              third_party/veusz/README.md \
              third_party/labplot_reference
          } | sed '/^$/d')"
          if [[ -n "$forbidden" ]]; then
            echo "Local-only or non-distribution files are tracked:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi
      - &compile_owned
        name: Compile SciPlot-owned Python
        run: python3 -m compileall -q src/sciplot_core src/sciplot_gui src/sciplot_recipes
      - &install_toolchain
        name: Install matching system Python and Qt toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential qt6-base-dev qt6-image-formats-plugins python3-dev python3-venv zsh \
            python3-pyqt6 python3-pyqt6.qtsvg pyqt6-dev pyqt6-dev-tools \
            fonts-noto-cjk
          # Ubuntu's PyQt6 and qmake use the same distribution Qt libraries.
          # A PyPI PyQt6 wheel carries a separate Qt runtime, so keep the
          # distribution interpreter and expose its bindings to this venv.
          /usr/bin/python3 -m venv --system-site-packages .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
      - &install_runtime
        name: Install local runtime
        # Explicit Linux/Python 3.12 validation anchor; keep pandas 3.1 exercised.
        # This is not a universal freeze for the Python 3.11 language floor.
        run: >-
          python3 -m pip install -e '.[studio,dev,mcp]'
          'numpy==2.4.6' 'pandas==3.1.0' 'scipy==1.18.1'
          'Pillow==13.0.0' 'PyMuPDF==2.0'
      - &verify_qt
        name: Verify Qt build and runtime identity
        run: |
          python3 - <<'PY'
          import subprocess
          import shutil
          import sys
          import json
          import sysconfig
          import tempfile
          from pathlib import Path
          import PyQt6
          from PyQt6 import QtCore, QtGui, QtWidgets, QtPrintSupport, QtSvg, QtSvgWidgets, sip, uic
          from PyQt6.uic import loadUi

          qmake = subprocess.check_output(["qmake6", "-query", "QT_VERSION"], text=True).strip()
          runtime = QtCore.qVersion()
          binding = Path(PyQt6.__file__).resolve()
          assert sys.version_info[:2] == (3, 12), sys.version
          assert binding.is_relative_to("/usr/lib/python3/dist-packages"), binding
          assert qmake == runtime, (qmake, runtime)
          assert (binding.parent / "bindings/QtCore/QtCore.toml").is_file(), binding
          assert Path(uic.__file__).resolve().is_relative_to(binding.parent), uic.__file__
          assert callable(loadUi) and all((QtGui, QtWidgets, QtPrintSupport, QtSvg, QtSvgWidgets, sip))
          assert shutil.which("zsh"), "Delivery launchers require zsh"
          formats = {bytes(name).decode("ascii").lower() for name in QtGui.QImageWriter.supportedImageFormats()}
          assert {"png", "tiff"} <= formats, sorted(formats)
          with tempfile.TemporaryDirectory(prefix="sciplot-qt-tiff-") as temporary:
              path = Path(temporary) / "probe.tiff"
              image = QtGui.QImage(1, 1, QtGui.QImage.Format.Format_RGB32)
              image.fill(QtGui.QColor("red"))
              writer = QtGui.QImageWriter(str(path), b"tiff")
              assert writer.write(image), writer.errorString()
              assert path.is_file() and path.stat().st_size > 0
              reopened = QtGui.QImage(str(path))
              assert not reopened.isNull() and (reopened.width(), reopened.height()) == (1, 1)
              assert reopened.pixelColor(0, 0) == image.pixelColor(0, 0)
          print(f"Python {sys.version.split()[0]}; PyQt {QtCore.PYQT_VERSION_STR}; Qt build/runtime {runtime}; {binding}")
          from sciplot_core.verification.private_process_boundaries import executable_hash, runtime_identity
          observation_runtime = runtime_identity()
          executable_sha256 = executable_hash(sys.executable)
          assert executable_sha256 is not None
          print(json.dumps({
              "observation_runtime": observation_runtime,
              "python_executable_sha256": executable_sha256,
              "executable_owns_observation_core": executable_sha256 in observation_runtime["loaded_core_sha256"],
              "py_enable_shared_build_flag": sysconfig.get_config_var("Py_ENABLE_SHARED"),
          }, sort_keys=True))
          PY
      - &verify_glyphs
        name: Verify Chinese glyph fallback in the system Qt runtime
        run: |
          python3 - <<'PYFONT'
          from PyQt6.QtGui import QFont, QGuiApplication, QTextLayout
          app = QGuiApplication([])
          text = "\u4f4e\u6e29\u6297\u51b2\u51fb\u80fd\u529b"
          layout = QTextLayout(text, QFont("Arial", 8))
          layout.beginLayout()
          line = layout.createLine()
          layout.endLayout()
          runs = layout.glyphRuns()
          assert runs and all(index != 0 for run in runs for index in run.glyphIndexes()), "Missing Chinese glyph fallback"
          print({"text": text, "fallback_families": [run.rawFont().familyName() for run in runs]})
          PYFONT
      - name: Run lint gate
        run: python3 -m ruff check src tests
      - name: Run scoped static type gate
        run: |
          python3 -m mypy --platform linux
          python3 -m mypy --platform darwin
      - &build_helpers
        name: Build vendored Veusz helpers
        working-directory: third_party/veusz
        run: QMAKE_EXE="$(command -v qmake6)" python3 setup.py build_ext --inplace
      - &verify_helpers
        name: Verify vendored Veusz helpers
        env:
          PYTHONPATH: third_party/veusz
        run: python3 -c 'from veusz.helpers import _nc_cntr, qtmml, qtloops, recordpaint, threed; assert all((qtloops, qtmml, recordpaint, threed, _nc_cntr))'
      - name: Verify minimal wheel surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip wheel . --no-deps --no-build-isolation \
            --wheel-dir /tmp/sciplot-wheel
          python3 tests/test_wheel_surface.py /tmp/sciplot-wheel/*.whl
      - name: Check known native CI regressions before the public suites
        # This bounded diagnostic keeps the original five failures visible.
        # Both complete canonical suites still run below without filters.
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from sciplot_core.verification.public_stage import RECEIPT, create_stage, review_stage_reports, runtime_binding

          root = Path.cwd().resolve()
          output = root / ".tmp_verify/ci_known_native_regressions"
          environment = dict(os.environ)
          assert not environment.get("PYTEST_ADDOPTS", "").strip()
          expected = {
              "tests/test_mechanical_rendering_profile_native.py::test_wide_category_native_labels_fit_and_clipped_rotation_cannot_commit",
              "tests/test_private_observer.py::test_archived_metadata_reads_keep_actual_root_and_node_boundaries",
              "tests/test_private_observer.py::test_suite_parent_collector_and_supervisor_share_actual_scope[False]",
              "tests/test_private_observer.py::test_suite_parent_collector_and_supervisor_share_actual_scope[True]",
              "tests/test_render_worker_rejection.py::test_real_public_radar_size_conflict_retains_clear_reason_and_no_artifacts",
          }
          expression = " or ".join(sorted({node.split("::", 1)[1].split("[", 1)[0] for node in expected}))
          stage, child_environment, before = create_stage(root, output, environment)
          receipt_path = stage / RECEIPT
          assert json.loads(receipt_path.read_bytes()) == before
          receipt_sha256 = hashlib.sha256(receipt_path.read_bytes()).hexdigest()
          # The validator must be loaded by the actual staged source owner.
          # Its receipt remains fixed to create_stage's original in-memory seal.
          validate = [sys.executable, "-c", "import hashlib,os,sys;from pathlib import Path;from sciplot_core.verification.public_stage import RECEIPT,validate_stage;assert hashlib.sha256((Path.cwd()/RECEIPT).read_bytes()).hexdigest()==sys.argv[1];validate_stage(Path.cwd(),dict(os.environ))", receipt_sha256]
          subprocess.run(validate, cwd=stage, env=child_environment, check=True)
          finish, reports_path = output / "finish.json", output / "reports.json"
          child_environment.update(SCIPLOT_VERIFY_FINISH=str(finish), SCIPLOT_PUBLIC_STAGE_REPORT=str(reports_path))
          command = [sys.executable, "-m", "pytest", "-vv", "-p", "sciplot_core.verification.pytest_finish",
                     "-p", "sciplot_core.verification.public_stage", "--input-scope", "public-all", "-k", expression,
                     "--basetemp", str(output / "pytest-tmp")]
          result = subprocess.run(command, cwd=stage, env=child_environment, stdin=subprocess.DEVNULL, check=False)
          post = subprocess.run(validate, cwd=stage, env=child_environment, check=False)
          marker = json.loads(finish.read_bytes()) if finish.is_file() else {}
          reports = json.loads(reports_path.read_bytes()) if reports_path.is_file() else {}
          issues = review_stage_reports(marker, reports, platform=sys.platform)
          if set(marker.get("selected_tests", [])) != expected:
              issues.append("The bounded CI regression selection must contain exactly the original five nodes.")
          phases = [(row.get("nodeid"), row.get("when"), row.get("outcome")) for row in reports.get("reports", [])]
          required = {(node, phase, "passed") for node in expected for phase in ("setup", "call", "teardown")}
          if len(phases) != 15 or set(phases) != required:
              issues.append("All fifteen original regression phases must pass without skips or duplicates.")
          origin_runtime_equal = runtime_binding(root, environment) == before["runtime"]
          if post.returncode != 0 or not origin_runtime_equal:
              issues.append("Original or staged source/runtime binding changed.")
          summary = {"kind": "sciplot_bounded_ci_regression_preflight", "origin_head": before["origin_head"],
                     "actual_exit_code": result.returncode, "finish_complete": marker.get("complete"),
                     "selected_nodes": marker.get("selected_tests", []), "phase_count": len(phases), "issues": issues,
                     "full_public_acceptance": False, "scientific_acceptance": False, "access_capture_complete": False}
          (output / "scoped-result.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary))
          if result.returncode or issues:
              for log in sorted((output / "pytest-tmp").rglob("native-worker.log")):
                  print(f"Generated regression diagnostic: {log}")
                  print(log.read_text(errors="replace"))
          raise SystemExit(result.returncode if result.returncode else (4 if issues else 0))
          PY

  public-behavior:
    name: Public behavior (${{ matrix.profile }})
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      # Keep the other complete profile and its failure evidence running.
      fail-fast: false
      matrix:
        profile: [public-focused, public-comprehensive]
    env: *runtime_environment
    steps:
      - *checkout
      - *distribution_policy
      - *compile_owned
      - *install_toolchain
      - *install_runtime
      - *verify_qt
      - *verify_glyphs
      - *build_helpers
      - *verify_helpers
      - name: Run reviewed public focused behavior
        if: matrix.profile == 'public-focused'
        run: python3 -m pytest -q --input-scope public-focused
      - name: Run reviewed public comprehensive behavior
        if: matrix.profile == 'public-comprehensive'
        # Original generated observer negatives genuinely disable Python hooks.
        # Execute every public comprehensive node in a bound source-only stage;
        # raw/golden private namespaces remain outside its input closure.
        shell: bash
        run: |
          set -euo pipefail
          # Stream the original generated-only log while preserving the stage's
          # exit status and its complete source/runtime/selected-body checks.
          (
            until [[ -f .tmp_verify/ci_public_comprehensive/command.log ]]; do
              sleep 1
            done
            exec tail -n +1 --follow=name --retry .tmp_verify/ci_public_comprehensive/command.log
          ) &
          progress_pid=$!
          trap 'kill "$progress_pid" 2>/dev/null || true; wait "$progress_pid" 2>/dev/null || true' EXIT
          stage_status=0
          python3 -m sciplot_core.verification.public_stage --profile public-comprehensive --out .tmp_verify/ci_public_comprehensive || stage_status=$?
          kill "$progress_pid" 2>/dev/null || true
          wait "$progress_pid" 2>/dev/null || true
          trap - EXIT
          if [[ "$stage_status" -ne 0 && -f .tmp_verify/ci_public_comprehensive/command.log ]]; then
            tail -n 120 .tmp_verify/ci_public_comprehensive/command.log || true
          fi
          exit "$stage_status"
      - name: Verify source-checkout wrapper bootstrap
        if: matrix.profile == 'public-focused'
        run: env -u PYTHONPATH SCIPLOT_PYTHON=python3 skill/scripts/sciplot --help >/dev/null
      - name: Run readiness check
        if: matrix.profile == 'public-focused'
        run: skill/scripts/sciplot doctor --json
      - name: Run fixture-free lifecycle smoke
        if: matrix.profile == 'public-focused'
        run: skill/scripts/sciplot smoke --out .tmp_verify/ci_runtime_smoke --json

  runtime-integrity:
    # Keep the existing required check, including failure/cancellation cases.
    if: ${{ always() }}
    needs: [preflight, public-behavior]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete CI gates
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PUBLIC_BEHAVIOR_RESULT: ${{ needs['public-behavior'].result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$PUBLIC_BEHAVIOR_RESULT" = success
