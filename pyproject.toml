[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciplot-core"
version = "0.1.0"
description = "Local SciPlot core, Studio, recipes, QA, and optional assisted cleanup for scientific plotting."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "openpyxl",
  "xlrd",
  "PyMuPDF",
  "Pillow",
  "platformdirs",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]
studio = [
  "astropy",
  "h5py",
  "iminuit",
  "PyQt6",
  "sip>=6.8,<7",
]

[project.scripts]
sciplot = "sciplot_core.cli:main"

[tool.ruff]
extend-exclude = ["third_party"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "focused: single-owner, in-process tests used during local iteration",
  "comprehensive: cross-process Veusz, real export, or complete Studio lifecycle tests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sciplot_core = [
  "human_daily_use_validation.json",
  "validated_envelopes.json",
  "intake/intake_static/*",
  "policy/plot_contract.json",
]
