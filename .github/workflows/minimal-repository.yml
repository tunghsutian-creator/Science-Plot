# Diagnostic branch only. Never merge this reduced selection into release gates.
name: Related native scientific text verification

on:
  push:
    branches:
      - codex/assembly-ci-diagnostic-20261015

jobs:
  runtime-integrity:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4caed1c94abd5056f5f823e5d4217687781f4c84
      - name: Enforce minimal runtime distribution
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$({
            # A file cannot be both source-controlled and declared local-only.
            git ls-files -ci --exclude-standard
            git ls-files \
              examples example tmp tools outputs figures ftir_output .tmp_verify \
              .superpowers sciplot-main .DS_Store AGENTS.md DEVELOPMENT_LOG.md Makefile \
              Launch_SciPlot_App.command
            # The curated docs and public showcase are explicitly unignored in
            # .gitignore. The tracked-ignored check above still rejects any
            # local-only docs without duplicating that allowlist here.
            git ls-files \
              third_party/veusz/tests \
              third_party/veusz/examples \
              third_party/veusz/Documents \
              third_party/veusz/.github \
              third_party/veusz/support \
              third_party/veusz/ChangeLog \
              third_party/veusz/INSTALL.md \
              third_party/veusz/README.md \
              third_party/labplot_reference
          } | sed '/^$/d')"
          if [[ -n "$forbidden" ]]; then
            echo "Local-only or non-distribution files are tracked:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi
      - name: Compile SciPlot-owned Python
        run: python3 -m compileall -q src/sciplot_core src/sciplot_gui src/sciplot_recipes
      - name: Install matching system Python and Qt toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential qt6-base-dev qt6-image-formats-plugins python3-dev python3-venv zsh \
            python3-pyqt6 python3-pyqt6.qtsvg pyqt6-dev pyqt6-dev-tools \
            fonts-noto-cjk
          # Ubuntu's PyQt6 and qmake use the same distribution Qt libraries.
          # A PyPI PyQt6 wheel carries a separate Qt runtime, so keep the
          # distribution interpreter and expose its bindings to this venv.
          /usr/bin/python3 -m venv --system-site-packages .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
      - name: Install local runtime
        run: python3 -m pip install -e '.[studio,dev,mcp]'
      - name: Verify Qt build and runtime identity
        run: |
          python3 - <<'PY'
          import subprocess
          import shutil
          import sys
          import json
          import sysconfig
          import tempfile
          from pathlib import Path
          import PyQt6
          from PyQt6 import QtCore, QtGui, QtWidgets, QtPrintSupport, QtSvg, QtSvgWidgets, sip, uic
          from PyQt6.uic import loadUi

          qmake = subprocess.check_output(["qmake6", "-query", "QT_VERSION"], text=True).strip()
          runtime = QtCore.qVersion()
          binding = Path(PyQt6.__file__).resolve()
          assert sys.version_info[:2] == (3, 12), sys.version
          assert binding.is_relative_to("/usr/lib/python3/dist-packages"), binding
          assert qmake == runtime, (qmake, runtime)
          assert (binding.parent / "bindings/QtCore/QtCore.toml").is_file(), binding
          assert Path(uic.__file__).resolve().is_relative_to(binding.parent), uic.__file__
          assert callable(loadUi) and all((QtGui, QtWidgets, QtPrintSupport, QtSvg, QtSvgWidgets, sip))
          assert shutil.which("zsh"), "Delivery launchers require zsh"
          formats = {bytes(name).decode("ascii").lower() for name in QtGui.QImageWriter.supportedImageFormats()}
          assert {"png", "tiff"} <= formats, sorted(formats)
          with tempfile.TemporaryDirectory(prefix="sciplot-qt-tiff-") as temporary:
              path = Path(temporary) / "probe.tiff"
              image = QtGui.QImage(1, 1, QtGui.QImage.Format.Format_RGB32)
              image.fill(QtGui.QColor("red"))
              writer = QtGui.QImageWriter(str(path), b"tiff")
              assert writer.write(image), writer.errorString()
              assert path.is_file() and path.stat().st_size > 0
              reopened = QtGui.QImage(str(path))
              assert not reopened.isNull() and (reopened.width(), reopened.height()) == (1, 1)
              assert reopened.pixelColor(0, 0) == image.pixelColor(0, 0)
          print(f"Python {sys.version.split()[0]}; PyQt {QtCore.PYQT_VERSION_STR}; Qt build/runtime {runtime}; {binding}")
          from sciplot_core.verification.private_process_boundaries import executable_hash, runtime_identity
          observation_runtime = runtime_identity()
          executable_sha256 = executable_hash(sys.executable)
          assert executable_sha256 is not None
          print(json.dumps({
              "observation_runtime": observation_runtime,
              "python_executable_sha256": executable_sha256,
              "executable_owns_observation_core": executable_sha256 in observation_runtime["loaded_core_sha256"],
              "py_enable_shared_build_flag": sysconfig.get_config_var("Py_ENABLE_SHARED"),
          }, sort_keys=True))
          PY
      - name: Verify Chinese glyph fallback in the system Qt runtime
        run: |
          python3 - <<'PYFONT'
          from PyQt6.QtGui import QFont, QGuiApplication, QTextLayout
          native_tiffs = []
          seen_tiffs = {}
          for path in sorted(base.rglob('*.tiff')):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest not in seen_tiffs:
                  retained = f'native-{len(seen_tiffs)}.tiff'
                  shutil.copy2(path, out / retained)
                  seen_tiffs[digest] = retained
              native_tiffs.append({'source': str(path), 'retained': seen_tiffs[digest], 'sha256': digest, 'bytes': path.stat().st_size})
          app = QGuiApplication([])
          text = "\u4f4e\u6e29\u6297\u51b2\u51fb\u80fd\u529b"
          layout = QTextLayout(text, QFont("Arial", 8))
          layout.beginLayout()
          line = layout.createLine()
          layout.endLayout()
          runs = layout.glyphRuns()
          assert runs and all(index != 0 for run in runs for index in run.glyphIndexes()), "Missing Chinese glyph fallback"
          print({"text": text, "fallback_families": [run.rawFont().familyName() for run in runs]})
          PYFONT
      - name: Run lint gate
        run: python3 -m ruff check src tests
      - name: Run scoped static type gate
        run: python3 -m mypy
      - name: Build vendored Veusz helpers
        working-directory: third_party/veusz
        run: QMAKE_EXE="$(command -v qmake6)" python3 setup.py build_ext --inplace
      - name: Verify vendored Veusz helpers
        env:
          PYTHONPATH: third_party/veusz
        run: python3 -c 'from veusz.helpers import _nc_cntr, qtmml, qtloops, recordpaint, threed; assert all((qtloops, qtmml, recordpaint, threed, _nc_cntr))'
      - name: Verify minimal wheel surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip wheel . --no-deps --no-build-isolation \
            --wheel-dir /tmp/sciplot-wheel
          python3 tests/test_wheel_surface.py /tmp/sciplot-wheel/*.whl
      - name: Bind the exact current unmodified release source
        run: |
          mkdir -p .tmp_verify/ci_performance_baseline
          python3 - <<'PYBIND'
          import json, subprocess
          from pathlib import Path
          from sciplot_core.verification.public_stage import source_binding
          root = Path.cwd()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == '4caed1c94abd5056f5f823e5d4217687781f4c84', head
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          before = source_binding(root)
          Path('.tmp_verify/ci_performance_baseline/before.json').write_text(json.dumps(before, sort_keys=True))
          print({'head': head, 'scope': 'Four original public comprehensive nodes; scoped verification only; no in-job product mutation or prototype'})
          PYBIND
      - name: Execute related original native contracts
        shell: bash
        env:
          SCIPLOT_PUBLIC_STAGE_REPORT: .tmp_verify/ci_performance_baseline/reports.json
          SCIPLOT_VERIFY_FINISH: .tmp_verify/ci_performance_baseline/finish.json
        run: |
          set -uo pipefail
          set +e
          python3 -m pytest -q --tb=long \
            -p sciplot_core.verification.pytest_finish \
            -p sciplot_core.verification.public_stage \
            --input-scope public-comprehensive \
            --basetemp=/tmp/sciplot-current-performance-diagnostic \
            -k 'test_ready_performance_studio_review_preserves_lineage or test_performance_direct_render_passes_exact_native_qa or test_native_radar_long_mixed_units_and_incomplete_negative_reference' \
            2>&1 | tee .tmp_verify/ci_performance_baseline/command.log
          test_exit=${PIPESTATUS[0]}
          printf '%s\n' "$test_exit" > .tmp_verify/ci_performance_baseline/exit.txt
          exit "$test_exit"
      - name: Preserve current original QA and actual native font evidence
        if: always()
        run: |
          python3 - <<'PYQA'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          import fitz
          from PyQt6.QtGui import QFont, QGuiApplication, QRawFont, QTextLayout
          from sciplot_core.qa.pdf_text import _text_object_info
          from sciplot_core.verification.public_stage import source_binding
          root = Path.cwd()
          out = root / '.tmp_verify/ci_performance_baseline'
          out.mkdir(parents=True, exist_ok=True)
          before_path = out / 'before.json'
          after = source_binding(root)
          (out / 'after.json').write_text(json.dumps(after, sort_keys=True))
          before = json.loads(before_path.read_text()) if before_path.exists() else None
          source_unchanged = before == after if before is not None else None
          base = Path('/tmp/sciplot-current-performance-diagnostic')
          rows = []
          for index, path in enumerate(sorted(base.rglob('publication_qa.json'))):
              qa = json.loads(path.read_text())
              shutil.copy2(path, out / f'publication_qa-{index}.json')
              rows.append({'path': str(path), 'status': qa.get('status'), 'blocking_check_ids': qa.get('blocking_check_ids'), 'failed_checks': [c for c in qa.get('checks', []) if c.get('status') == 'failed']})
          fonts = []
          for index, path in enumerate(sorted(base.rglob('*.pdf'))):
              document = fitz.open(path)
              text_objects = _text_object_info(document)
              spans = [s for page in document for b in page.get_text('dict')['blocks'] if 'lines' in b for line in b['lines'] for s in line['spans']]
              fonts.append({'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'pdf_fonts': sorted({font[3] for page in document for font in page.get_fonts()}), 'ordinary_minimum_size_pt': text_objects['ordinary_minimum_size_pt'], 'math_script_minimum_size_pt': text_objects['math_script_minimum_size_pt'], 'math_script_spans': [item for item in text_objects['visible_spans'] if item['role']=='math_script'], 'superscript_minus_spans': [{k:s[k] for k in ('text','font','size','bbox','origin')} for s in spans if '\u207b' in s['text']]})
              document.close()
              shutil.copy2(path, out / f'native-{index}.pdf')
          native_tiffs = []
          seen_tiffs = {}
          for path in sorted(base.rglob('*.tiff')):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest not in seen_tiffs:
                  retained = f'native-{len(seen_tiffs)}.tiff'
                  shutil.copy2(path, out / retained)
                  seen_tiffs[digest] = retained
              native_tiffs.append({'source': str(path), 'retained': seen_tiffs[digest], 'sha256': digest, 'bytes': path.stat().st_size})
          app = QGuiApplication([])
          font = QFont('Arial', 7)
          raw = QRawFont.fromFont(font)
          layout = QTextLayout('Specific impact strength (kJ m\u207b\u00b2)', font)
          layout.beginLayout(); layout.createLine(); layout.endLayout()
          payload = {'kind': 'current_native_typesetting_verification', 'head': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'source_unchanged': source_unchanged, 'qa': rows, 'pdf': fonts, 'native_tiffs': native_tiffs, 'qt_primary_font': raw.familyName(), 'qt_primary_has_u207b': raw.supportsCharacter(0x207B), 'qt_actual_glyph_families': [r.rawFont().familyName() for r in layout.glyphRuns()], 'release_validation': False, 'in_job_product_mutation_or_prototype': False, 'qt_probe_scope': 'Unmodified QTextLayout availability; inspect native PDF for the Veusz script result'}
          (out / 'qa-details.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2))
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          assert before is not None and source_unchanged is True, 'Original release source changed or was not captured'
          PYQA
      - name: Upload only generated public diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-native-typesetting-4caed1c
          path: .tmp_verify/ci_performance_baseline/
          if-no-files-found: error
