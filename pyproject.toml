[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciplot-core"
version = "0.1.0"
description = "Local SciPlot core, Studio, recipes, QA, and optional assisted cleanup for scientific plotting."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "openpyxl",
  "xlrd",
  "PyMuPDF",
  "Pillow",
  "platformdirs",
]

[project.optional-dependencies]
mcp = ["mcp==2.1.1"]
dev = [
  "types-jsonschema==4.26.0.20260518",
  "mypy==2.3.0",
  "pandas-stubs==3.0.3.260530",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]
studio = [
  "astropy",
  "h5py",
  "iminuit",
  "PyQt6",
  "sip>=6.8,<7",
]

[project.scripts]
sciplot = "sciplot_core.cli:main"

[tool.ruff]
extend-exclude = ["third_party"]

[tool.ruff.lint]
extend-select = [
  "B",
  "DTZ",
  "FURB162",
  "PLC0206",
  "PLW2901",
  "RUF012",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "focused: single-owner, in-process tests used during local iteration",
  "comprehensive: cross-process Veusz, real export, or complete Studio lifecycle tests",
]

